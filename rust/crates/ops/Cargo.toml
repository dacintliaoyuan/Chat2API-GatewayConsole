[package]
name = "um-ops"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "um_ops"
path = "src/lib.rs"

[[bin]]
name = "um-ops"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[dev-dependencies]
um-test-harness = { path = "../test-harness" }
