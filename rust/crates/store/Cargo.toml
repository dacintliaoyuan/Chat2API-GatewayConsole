[package]
name = "um-store"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "um_store"
path = "src/lib.rs"

[dependencies]
aes-gcm = "0.10"
getrandom = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
sha2 = "0.10"
um-contract = { path = "../contract" }

[dev-dependencies]
hex = "0.4"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
