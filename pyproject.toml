[tool.ruff]
target-version = "py314"
line-length = 100
exclude = [
  ".git",
  "node_modules",
  "web/node_modules",
  "web/dist",
  "web/dist-cloud",
  "web/release",
  "data",
  "output",
  "tmp",
]

[tool.ruff.lint]
# Syntax errors and undefined names: fast, deterministic, no existing baseline.
select = ["E9", "F63", "F7", "F82"]
