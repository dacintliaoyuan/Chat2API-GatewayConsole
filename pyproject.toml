[tool.ruff]
target-version = "py314"
line-length = 100
exclude = [
  ".git",
  "node_modules",
  "web/node_modules",
  "web/dist",
  "web/dist-cloud",
  "web/release",
  "data",
  "output",
  "tmp",
]

[tool.ruff.lint]
# Syntax errors and undefined names: fast, deterministic, no existing baseline.
# F401 and BLE001 are cleared: unused imports are removed; blind catches stay
# only at boundary layers where every failure is an honest reported outcome, each
# pinned with a reasoned noqa.
select = ["E9", "F63", "F7", "F82", "BLE001", "F401"]
