name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip requests

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Fast checks, frontend gates and the full Python suite
        run: bash scripts/check.sh --full

      - name: Cloud console gate
        working-directory: web
        run: npm run check:cloud-console

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust workspace tests
        run: bash scripts/check-rust.sh

  edge-regression:
    # The real-Edge tests are #[ignore]d: they drive an installed Edge on an
    # isolated profile and a loopback fixture, never real UM data.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Real Edge login regression
        run: bash scripts/check-rust.sh --edge
