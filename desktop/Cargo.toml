[package]
name = "um-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false

# Standalone crate: deliberately outside the rust/ workspace so the Slint MSRV
# does not raise the main workspace's rust-version (issue #123).
[workspace]

[[bin]]
name = "um-desktop"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
getrandom = "0.2"
serde_json = "1"
slint = { version = "=1.19.0", default-features = false, features = ["std", "backend-winit", "renderer-software", "software-renderer-path", "accessibility", "compat-1-2"] }
um-console = { path = "../rust/crates/console" }
ureq = { version = "2.12", features = ["json"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "=1.19.0"
